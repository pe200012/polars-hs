[package]
name = "polars-hs-ffi"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[lib]
name = "polars_hs_ffi"
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"
polars = { version = "0.53.0", default-features = false, features = ["lazy", "csv", "parquet", "ipc", "fmt", "dtype-slim", "strings", "temporal", "dtype-u8", "dtype-u16", "dtype-i8", "dtype-i16", "is_in", "is_between", "is_close", "is_unique", "is_first_distinct", "is_last_distinct", "rank", "cum_agg", "round_series", "moment", "propagate_nans"] }
polars-arrow = "0.53.0"

[build-dependencies]
cbindgen = "0.29"
